name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # lint y test corren EN PARALELO a propósito. Antes `test` tenía `needs: lint`,
  # así que un detalle de formato bloqueaba toda la verificación funcional: el
  # lint falló durante meses y los tests no llegaron a ejecutarse ni una vez.
  # El run sigue fallando si cualquiera de los dos falla, pero ahora un rojo de
  # formato no esconde si el paquete funciona.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Versión FIJADA. Sin el pin, `pip install ruff` traía la última versión
      # en cada corrida y un cambio de comportamiento de ruff (0.14 empezó a
      # formatear bloques de código Python dentro de Markdown) puso el build en
      # rojo sin que cambiara una sola línea de código, durante meses.
      - run: pip install "ruff==0.16.10"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 3.8 salió de la matriz: está EOL desde octubre de 2024 y forzaba un
      # geopandas viejo que espera fiona.path, API que Fiona 2.x eliminó. Esa
      # combinación fallaba en el setup de TODOS los tests.
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        run: pytest tests/ --cov=shalstab --cov-report=xml --cov-report=term-missing -v
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
